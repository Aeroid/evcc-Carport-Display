type: custom:button-card
show_name: false
show_icon: false
show_state: false
styles:
  card:
    - padding: 0
    - border-radius: 10px
    - overflow: hidden
    - background: white
    - border: 1px solid "#e0e0e0"
custom_fields:
  dashboard: |
    [[[
      const soc_mini_raw    = parseFloat(states['sensor.countryman_e_battery_ev_predicted_state_of_charge']?.state) || 0;
      const soc_volvo_raw   = parseFloat(states['sensor.volvo_xc40_batterie']?.state) || 0;
      const soc_akku        = parseFloat(states['sensor.battery_percent']?.state) || 0;

      const range_mini_raw  = Math.round(parseFloat(states['sensor.countryman_e_range_ev_estimate_during_charging']?.state) || 0);
      const range_volvo_raw = Math.round(parseFloat(states['sensor.volvo_xc40_reichweite_bis_batterie_leer']?.state) || 0);

      const evcc_soc   = parseFloat(states['sensor.evcc_carport_vehicle_soc']?.state) || 0;
      const evcc_range = Math.round(parseFloat(states['sensor.evcc_carport_vehicle_range']?.state) || 0);
      const charged    = Math.round(parseFloat(states['sensor.evcc_carport_charged_energy']?.state) || 0);

      const vehicle      = states['select.evcc_carport_vehicle_name']?.state || '';
      const active_mini  = vehicle.includes('db:16');
      const active_volvo = vehicle.includes('db:8');

      const soc_mini    = (active_mini  && evcc_soc   > 0) ? evcc_soc   : soc_mini_raw;
      const soc_volvo   = (active_volvo && evcc_soc   > 0) ? evcc_soc   : soc_volvo_raw;
      const range_mini  = (active_mini  && evcc_range > 0) ? evcc_range : range_mini_raw;
      const range_volvo = (active_volvo && evcc_range > 0) ? evcc_range : range_volvo_raw;

      const cap_mini_raw = parseFloat(states['sensor.countryman_e_battery_hv_energy_content']?.state) || 32.6;
      const pv_rest      = parseFloat(states['sensor.verbleibende_pv_produktion']?.state) || 0;

      const free_mini  = Math.round((1 - soc_mini  / 100) * cap_mini_raw);
      const free_volvo = Math.round((1 - soc_volvo / 100) * 82);
      const free_akku  = Math.round((1 - soc_akku  / 100) * 28);
      const pv_rounded = Math.round(pv_rest);

      const LBL = 'font-family:monospace; font-size:9px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:#888; margin-bottom:2px;';

      const infoBlock = (lbl, val, unit) =>
        '<div><div style="' + LBL + '">' + lbl + '</div>' +
        '<div style="display:inline-flex; align-items:baseline; gap:2px;">' +
        '<span style="font-family:sans-serif; font-size:21px; font-weight:700; color:#111;">' + val + '</span>' +
        '<span style="font-family:sans-serif; font-size:11px; color:#888;">' + unit + '</span>' +
        '</div></div>';

      const carCell = (logoUri, logoH, range, soc, free, active, chargedKwh) =>
        '<div style="padding:10px 15px 10px;' + (active ? 'box-shadow:inset 0 0 0 4px #111;' : '') + '">' +
        '<div style="height:18px; display:flex; align-items:center; margin-bottom:6px;"><img src="' + logoUri + '" style="width:auto; height:' + logoH + 'px; display:block;"></div>' +
        '<div style="display:flex; align-items:baseline; gap:4px;">' +
        '<span style="font-family:sans-serif; font-size:62px; font-weight:700; line-height:1; color:#111;">' + range + '</span>' +
        '<span style="font-family:sans-serif; font-size:16px; color:#888;">km</span></div>' +
        '<div style="height:1px; background:#ddd; margin:8px 0 6px;"></div>' +
        '<div style="display:flex; gap:18px;">' +
        infoBlock('belegt', Math.round(soc), '%') +
        infoBlock('frei', free, 'kWh') +
        (active ? infoBlock('geladen', chargedKwh, 'kWh') : '') +
        '</div></div>';

      const bottomSlot = (lbl, val, unit) =>
        '<div style="flex:1;">' +
        '<div style="' + LBL + '">' + lbl + '</div>' +
        '<div style="display:inline-flex; align-items:baseline; gap:2px;">' +
        '<span style="font-family:sans-serif; font-size:30px; font-weight:700; line-height:1; color:#111;">' + val + '</span>' +
        '<span style="font-family:sans-serif; font-size:13px; color:#888;">' + unit + '</span>' +
        '</div></div>';

      const batIcon =
        '<svg width="29" height="18" viewBox="0 0 46 28" fill="none" style="flex-shrink:0;">' +
        '<rect x="1" y="1" width="41" height="26" rx="3" stroke="#111" stroke-width="3"/>' +
        '<rect x="5" y="5" width="18" height="18" rx="1" fill="#111"/>' +
        '<rect x="43" y="9" width="5" height="10" rx="1" fill="#111"/>' +
        '</svg>';

      const sunIcon =
        '<svg width="24" height="24" viewBox="0 0 54 54" fill="none" style="flex-shrink:0;">' +
        '<circle cx="27" cy="27" r="11" fill="#111"/>' +
        '<line x1="27" y1="2"  x2="27" y2="10" stroke="#111" stroke-width="4.5" stroke-linecap="round"/>' +
        '<line x1="27" y1="44" x2="27" y2="52" stroke="#111" stroke-width="4.5" stroke-linecap="round"/>' +
        '<line x1="2"  y1="27" x2="10" y2="27" stroke="#111" stroke-width="4.5" stroke-linecap="round"/>' +
        '<line x1="44" y1="27" x2="52" y2="27" stroke="#111" stroke-width="4.5" stroke-linecap="round"/>' +
        '<line x1="9"  y1="9"  x2="15" y2="15" stroke="#111" stroke-width="4.5" stroke-linecap="round"/>' +
        '<line x1="39" y1="39" x2="45" y2="45" stroke="#111" stroke-width="4.5" stroke-linecap="round"/>' +
        '<line x1="45" y1="9"  x2="39" y2="15" stroke="#111" stroke-width="4.5" stroke-linecap="round"/>' +
        '<line x1="15" y1="39" x2="9"  y2="45" stroke="#111" stroke-width="4.5" stroke-linecap="round"/>' +
        '</svg>';

      const miniUri  = 'data:image/svg+xml;base64,';
      const volvoUri = 'data:image/svg+xml;base64,';
      const evccUri  = 'data:image/svg+xml;base64,';

      return (
        '<div style="background:white; border-radius:10px; overflow:hidden;">' +
        '<div style="display:grid; grid-template-columns:1fr 1px 1fr;">' +
        carCell(miniUri,  18, range_mini,  soc_mini,  free_mini,  active_mini,  charged) +
        '<div style="background:#ddd;"></div>' +
        carCell(volvoUri,  9, range_volvo, soc_volvo, free_volvo, active_volvo, charged) +
        '</div>' +
        '<div style="height:1px; background:#ddd;"></div>' +
        '<div style="padding:9px 12px; display:flex; align-items:center; gap:5px;">' +
        batIcon +
        '<div style="width:15px; flex-shrink:0;"></div>' +
        bottomSlot('belegt', Math.round(soc_akku), '%') +
        bottomSlot('frei', free_akku, 'kWh') +
        bottomSlot('PV heute noch', '+' + pv_rounded, 'kWh') +
        sunIcon +
        '</div>' +
        '<div style="padding:3px 12px 5px; display:flex; justify-content:flex-end;">' +
        '<img src="' + evccUri + '" style="width:45px; height:12px;">' +
        '</div>' +
        '</div>'
      );
    ]]]
custom_fields_styles:
  dashboard:
    - width: 100%
    - padding: 0
